<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><title>美而美｜快速點餐</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#172033;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}header{background:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e7e9ed}h1{font-size:22px;margin:0}small,.muted{color:#687385}.shell{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);gap:16px;padding:16px;max-width:1500px;margin:auto}.panel{background:white;border-radius:16px;padding:18px;box-shadow:0 2px 12px #1720330b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:0;border-radius:999px;padding:11px 17px;background:#f1f3f5}.tabs button.active{background:#f97316;color:#fff}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.item{border:1px solid #e6e8ed;border-radius:14px;background:#fff;text-align:left;padding:16px;min-height:105px;display:flex;flex-direction:column;justify-content:space-between}.item:active{background:#fff1e7}.price{color:#ea580c;font-weight:800;font-size:21px}.order{display:flex;flex-direction:column;gap:12px}.orderline{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #f0f0f0;padding:10px 0}.qty{display:flex;align-items:center;gap:10px}.qty button{width:36px;height:36px;border:0;border-radius:10px;background:#eef0f3;font-weight:700}.total{display:flex;justify-content:space-between;align-items:center;border-top:2px solid #eee;padding-top:16px;font-size:21px}.total strong{font-size:38px;color:#ea580c}.paid{width:100%;padding:13px;border:1px solid #d7dbe1;border-radius:12px;font-size:24px}.quick{display:flex;flex-wrap:wrap;gap:7px}.quick button{border:0;border-radius:9px;background:#fff0e6;padding:10px 15px}.change{background:#f4f6f9;padding:15px;border-radius:12px;font-size:21px;display:flex;justify-content:space-between}.actions{display:flex;gap:8px}.primary,.secondary,.danger{border:0;border-radius:12px;padding:14px;font-weight:700}.primary{background:#f97316;color:white;flex:1}.secondary{background:#e9edf2}.danger{background:#fee2e2;color:#b91c1c}.empty{color:#7c8796;text-align:center;padding:28px 0}.settings{display:none}.settings.show{display:block}.editrow{display:grid;grid-template-columns:1fr 90px 90px auto;gap:8px;margin:8px 0}.editrow input,.editrow select,.add input,.add select{min-width:0;width:100%;border:1px solid #d8dde4;border-radius:9px;padding:10px}.add{display:grid;grid-template-columns:1fr 110px 90px auto;gap:8px;margin-top:16px}h2{font-size:19px;margin:0 0 15px}.notice{font-size:13px;color:#7b8490;margin-top:12px}@media(max-width:800px){.shell{grid-template-columns:1fr}.panel{padding:14px}.items{grid-template-columns:repeat(3,minmax(0,1fr))}.item{min-height:90px;padding:11px}.editrow,.add{grid-template-columns:1fr 85px;}.editrow button,.add button{grid-column:span 2}}@media(max-width:400px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><div><h1>🍳 美而美・快速點餐</h1><small>櫃檯計價系統 · 金額單位 NT$</small></div><button class="secondary" id="settingToggle">⚙ 菜單設定</button></header><main class="shell"><section class="panel"><h2>選擇餐點</h2><div class="tabs" id="tabs"></div><div class="items" id="items"></div></section><section class="panel"><h2>本筆訂單</h2><div id="order" class="order"></div><div class="total"><span>應收金額</span><strong id="total">$0</strong></div><p>實收金額</p><input id="paid" class="paid" type="number" min="0" step="1" inputmode="numeric" placeholder="輸入實收金額"><p class="muted">快速輸入</p><div class="quick" id="quick"></div><p class="change"><span id="changeLabel">找零</span><strong id="change">$0</strong></p><div class="actions"><button class="danger" id="clear">清空訂單</button><button class="primary" id="done">完成結帳・下一筆</button></div><p class="notice">此版本僅計價，不連接金流、不會上傳訂單；菜單儲存在此裝置的瀏覽器。</p></section><section class="panel settings" id="settings"><h2>菜單管理</h2><p class="muted">以下為示範品項與價格，正式使用前請依店內菜單調整。</p><div id="editor"></div><form id="addForm" class="add"><input id="newName" placeholder="餐點名稱" required maxlength="40"><select id="newCategory"></select><input id="newPrice" type="number" min="0" max="99999" step="1" placeholder="價格" required><button class="primary">新增品項</button></form><p><button id="reset" class="secondary">恢復示範菜單</button></p></section></main><script>
'use strict';const KEY='mei-er-mei-menu-v1';const categories=['漢堡','吐司','蛋餅','飲料','其他'];const demo=[['漢堡','豬肉漢堡',45],['漢堡','起司漢堡',55],['漢堡','雞腿漢堡',70],['吐司','火腿蛋吐司',40],['吐司','鮪魚蛋吐司',50],['吐司','培根蛋吐司',45],['蛋餅','原味蛋餅',30],['蛋餅','起司蛋餅',40],['蛋餅','玉米蛋餅',40],['飲料','紅茶',20],['飲料','奶茶',25],['飲料','豆漿',25],['其他','薯餅',25],['其他','雞塊',40]].map((x,i)=>({id:'demo'+i,category:x[0],name:x[1],price:x[2]}));
function load(){try{const a=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(a)&&a.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&categories.includes(x.category)&&Number.isInteger(x.price)&&x.price>=0))return a}catch(e){}return structuredClone(demo)}let menu=load(),cart={},category='全部';const $=id=>document.getElementById(id),money=n=>'$'+n.toLocaleString('zh-TW');function save(){localStorage.setItem(KEY,JSON.stringify(menu))}function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function renderMenu(){const tabs=$('tabs');tabs.replaceChildren();['全部',...categories].forEach(c=>{let b=node('button',c,c===category?'active':'');b.onclick=()=>{category=c;renderMenu()};tabs.append(b)});const area=$('items');area.replaceChildren();menu.filter(x=>category==='全部'||x.category===category).forEach(x=>{let b=node('button',undefined,'item');b.append(node('strong',x.name),node('span',money(x.price),'price'));b.onclick=()=>{cart[x.id]=(cart[x.id]||0)+1;renderCart()};area.append(b)});if(!area.children.length)area.append(node('p','這個分類尚無餐點','muted'))}function sum(){return menu.reduce((s,x)=>s+(cart[x.id]||0)*x.price,0)}function renderCart(){let o=$('order');o.replaceChildren();let entries=menu.filter(x=>cart[x.id]>0);if(!entries.length)o.append(node('p','尚未選擇餐點','empty'));entries.forEach(x=>{let line=node('div',undefined,'orderline'),info=node('div'),qty=node('div',undefined,'qty');info.append(node('strong',x.name),node('div',money(x.price*cart[x.id]),'muted'));let minus=node('button','−'),plus=node('button','+');minus.setAttribute('aria-label','減少'+x.name);plus.setAttribute('aria-label','增加'+x.name);minus.onclick=()=>{cart[x.id]--;if(cart[x.id]<=0)delete cart[x.id];renderCart()};plus.onclick=()=>{cart[x.id]++;renderCart()};qty.append(minus,node('strong',String(cart[x.id])),plus);line.append(info,qty);o.append(line)});$('total').textContent=money(sum());calc()}function calc(){let paid=$('paid').value,t=sum();if(paid===''){$('changeLabel').textContent='找零';$('change').textContent='$0';return}let p=Number(paid);if(!Number.isFinite(p)||p<0){$('change').textContent='請輸入有效金額';return}let d=Math.round(p)-t;$('changeLabel').textContent=d>=0?'找零':'尚差';$('change').textContent=money(Math.abs(d))}function clearOrder(){cart={};$('paid').value='';renderCart()}$('paid').addEventListener('input',calc);$('clear').onclick=()=>{if(Object.keys(cart).length&& !confirm('確定清空本筆訂單？'))return;clearOrder()};$('done').onclick=()=>{if(!Object.keys(cart).length)return alert('請先加入餐點');const p=$('paid').value;if(p===''||Number(p)<sum())return alert('實收金額不足或尚未輸入');if(confirm('確認完成結帳並清空本筆訂單？'))clearOrder()};[100,200,500,1000].forEach(v=>{let b=node('button',money(v));b.onclick=()=>{$('paid').value=v;calc()};$('quick').append(b)});let exact=node('button','剛好');exact.onclick=()=>{$('paid').value=sum();calc()};$('quick').prepend(exact);
$('settingToggle').onclick=()=>{$('settings').classList.toggle('show');if($('settings').classList.contains('show'))renderEditor()};function renderEditor(){const e=$('editor');e.replaceChildren();menu.forEach(x=>{let row=node('div',undefined,'editrow'),name=node('input'),price=node('input'),cat=node('select'),del=node('button','刪除','danger');name.value=x.name;name.maxLength=40;price.type='number';price.min=0;price.max=99999;price.step=1;price.value=x.price;categories.forEach(c=>{let op=node('option',c);op.value=c;cat.append(op)});cat.value=x.category;function update(){let n=name.value.trim(),p=Number(price.value);if(!n||price.value===''||!Number.isInteger(p)||p<0||p>99999)return;Object.assign(x,{name:n,price:p,category:cat.value});save();renderMenu();renderCart()}name.onchange=update;price.onchange=update;cat.onchange=update;del.onclick=()=>{if(!confirm('刪除 '+x.name+'？'))return;menu=menu.filter(y=>y.id!==x.id);delete cart[x.id];save();renderEditor();renderMenu();renderCart()};row.append(name,cat,price,del);e.append(row)})}categories.forEach(c=>{let op=node('option',c);op.value=c;$('newCategory').append(op)});$('addForm').onsubmit=e=>{e.preventDefault();let name=$('newName').value.trim(),p=Number($('newPrice').value);if(!name||!Number.isInteger(p)||p<0||p>99999)return alert('請輸入正確名稱與整數價格');menu.push({id:'item-'+crypto.randomUUID(),name,price:p,category:$('newCategory').value});save();$('addForm').reset();renderEditor();renderMenu()};$('reset').onclick=()=>{if(!confirm('確定恢復示範菜單？目前修改會被覆蓋。'))return;menu=structuredClone(demo);cart={};save();renderEditor();renderMenu();clearOrder()};renderMenu();renderCart();
</script></body></html>

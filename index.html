<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><title>美而美｜快速點餐</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#172033;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}header{background:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e7e9ed}h1{font-size:22px;margin:0}small,.muted{color:#687385}.shell{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);gap:16px;padding:16px;max-width:1500px;margin:auto}.panel{background:white;border-radius:16px;padding:18px;box-shadow:0 2px 12px #1720330b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:0;border-radius:999px;padding:11px 17px;background:#f1f3f5}.tabs button.active{background:#f97316;color:#fff}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.item{border:1px solid #e6e8ed;border-radius:14px;background:#fff;text-align:left;padding:16px;min-height:105px;display:flex;flex-direction:column;justify-content:space-between}.item:active{background:#fff1e7}.price{color:#ea580c;font-weight:800;font-size:21px}.order{display:flex;flex-direction:column;gap:12px}.orderline{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #f0f0f0;padding:10px 0}.qty{display:flex;align-items:center;gap:10px}.qty button{width:36px;height:36px;border:0;border-radius:10px;background:#eef0f3;font-weight:700}.total{display:flex;justify-content:space-between;align-items:center;border-top:2px solid #eee;padding-top:16px;font-size:21px}.total strong{font-size:38px;color:#ea580c}.paid{width:100%;padding:13px;border:1px solid #d7dbe1;border-radius:12px;font-size:24px}.quick{display:flex;flex-wrap:wrap;gap:7px}.quick button{border:0;border-radius:9px;background:#fff0e6;padding:10px 15px}.change{background:#f4f6f9;padding:15px;border-radius:12px;font-size:21px;display:flex;justify-content:space-between}.actions{display:flex;gap:8px}.primary,.secondary,.danger{border:0;border-radius:12px;padding:14px;font-weight:700}.primary{background:#f97316;color:white;flex:1}.secondary{background:#e9edf2}.danger{background:#fee2e2;color:#b91c1c}.empty{color:#7c8796;text-align:center;padding:28px 0}.settings{display:none}.settings.show{display:block}.editrow{display:grid;grid-template-columns:1fr 90px 90px auto;gap:8px;margin:8px 0}.editrow input,.editrow select,.add input,.add select{min-width:0;width:100%;border:1px solid #d8dde4;border-radius:9px;padding:10px}.add{display:grid;grid-template-columns:1fr 110px 90px auto;gap:8px;margin-top:16px}h2{font-size:19px;margin:0 0 15px}.notice{font-size:13px;color:#7b8490;margin-top:12px}@media(max-width:800px){.shell{grid-template-columns:1fr}.panel{padding:14px}.items{grid-template-columns:repeat(3,minmax(0,1fr))}.item{min-height:90px;padding:11px}.editrow,.add{grid-template-columns:1fr 85px;}.editrow button,.add button{grid-column:span 2}}@media(max-width:400px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}}
dialog{border:0;border-radius:18px;padding:24px;width:min(460px,92vw);box-shadow:0 12px 60px #17203333}dialog::backdrop{background:#17203388}.addon-choice{display:flex;align-items:center;gap:12px;padding:15px;background:#f5f6f8;border-radius:12px;margin:10px 0;cursor:pointer}.addon-choice input{width:22px;height:22px;accent-color:#f97316}.addon-choice span{flex:1}.customize{border:0;border-radius:8px;background:#fff0e6;color:#9a3412;padding:8px 12px;margin-top:7px}.addon-editor,.addon-add{display:grid;grid-template-columns:1fr 100px auto;gap:8px;margin:10px 0}.addon-editor input,.addon-add input{min-width:0;width:100%;padding:10px;border:1px solid #d8dde4;border-radius:9px}.settings{grid-column:1/-1}.addon-section{margin-top:28px;border-top:1px solid #eee;padding-top:24px}#customTotal{font-size:28px;color:#ea580c}#customHint{line-height:1.6}@media(max-width:500px){.addon-editor,.addon-add{grid-template-columns:1fr 85px}.addon-editor button,.addon-add button{grid-column:span 2}.orderline{flex-wrap:wrap}}
</style></head><body><header><div><h1>🍳 美而美・快速點餐</h1><small>櫃檯計價系統 · 金額單位 NT$</small></div><button class="secondary" id="settingToggle">⚙ 菜單設定</button></header><main class="shell"><section class="panel"><h2>選擇餐點</h2><div class="tabs" id="tabs"></div><div class="items" id="items"></div></section><section class="panel"><h2>本筆訂單</h2><div id="order" class="order"></div><div class="total"><span>應收金額</span><strong id="total">$0</strong></div><p>實收金額</p><input id="paid" class="paid" type="number" min="0" step="1" inputmode="numeric" placeholder="輸入實收金額"><p class="muted">快速輸入</p><div class="quick" id="quick"></div><p class="change"><span id="changeLabel">找零</span><strong id="change">$0</strong></p><div class="actions"><button class="danger" id="clear">清空訂單</button><button class="primary" id="done">完成結帳・下一筆</button></div><p class="notice">此版本僅計價，不連接金流、不會上傳訂單；菜單儲存在此裝置的瀏覽器。</p></section><section class="panel settings" id="settings"><h2>菜單管理</h2><p class="muted">以下為示範品項與價格，正式使用前請依店內菜單調整。</p><div id="editor"></div><form id="addForm" class="add"><input id="newName" placeholder="餐點名稱" required maxlength="40"><select id="newCategory"></select><input id="newPrice" type="number" min="0" max="99999" step="1" placeholder="價格" required><button class="primary">新增品項</button></form><p><button id="reset" class="secondary">恢復示範菜單</button></p><div class="addon-section"><h2>加料選項設定</h2><p class="muted">可修改名稱、價格，或新增、刪除選項。設定會儲存在此裝置；價格變更套用至新加入的餐點。</p><div id="addonEditor"></div><form id="addonForm" class="addon-add"><input id="addonName" aria-label="新加料名稱" placeholder="加料名稱" maxlength="40" required><input id="addonPrice" aria-label="新加料價格" type="number" min="0" max="99999" step="1" placeholder="價格" required><button class="primary">新增加料</button></form></div></section></main><dialog id="customDialog" aria-labelledby="customTitle"><h2 id="customTitle">餐點客製化</h2><p id="customHint" class="muted"></p><div id="customOptions"></div><p class="total"><span>每份金額</span><strong id="customTotal"></strong></p><div class="actions"><button id="customCancel" class="secondary">取消</button><button id="customConfirm" class="primary">加入訂單</button></div></dialog><script>
'use strict';const KEY='mei-er-mei-menu-v1';const categories=['漢堡','吐司','蛋餅','飲料','其他'];const demo=[['漢堡','豬肉漢堡',45],['漢堡','起司漢堡',55],['漢堡','雞腿漢堡',70],['吐司','火腿蛋吐司',40],['吐司','鮪魚蛋吐司',50],['吐司','培根蛋吐司',45],['蛋餅','原味蛋餅',30],['蛋餅','起司蛋餅',40],['蛋餅','玉米蛋餅',40],['飲料','紅茶',20],['飲料','奶茶',25],['飲料','豆漿',25],['其他','薯餅',25],['其他','雞塊',40]].map((x,i)=>({id:'demo'+i,category:x[0],name:x[1],price:x[2]}));
const ADDON_KEY='mei-er-mei-addons-v1';
const defaultAddons=[{id:'egg',name:'加蛋',price:15},{id:'cheese',name:'起司',price:10},{id:'floss',name:'肉鬆',price:10}];
function load(){try{const a=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(a)&&a.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&categories.includes(x.category)&&Number.isInteger(x.price)&&x.price>=0))return a}catch(e){}return structuredClone(demo)}
function loadAddons(){try{const a=JSON.parse(localStorage.getItem(ADDON_KEY));if(Array.isArray(a)&&a.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&x.name.trim()&&Number.isInteger(x.price)&&x.price>=0&&x.price<=99999)&&new Set(a.map(x=>x.id)).size===a.length)return a}catch(e){}return structuredClone(defaultAddons)}
let menu=load(),addons=loadAddons(),cart={},category='全部',pending=null;
const $=id=>document.getElementById(id),money=n=>'$'+n.toLocaleString('zh-TW');
function save(){localStorage.setItem(KEY,JSON.stringify(menu))}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function renderMenu(){const tabs=$('tabs');tabs.replaceChildren();['全部',...categories].forEach(c=>{let b=node('button',c,c===category?'active':'');b.onclick=()=>{category=c;renderMenu()};tabs.append(b)});const area=$('items');area.replaceChildren();menu.filter(x=>category==='全部'||x.category===category).forEach(x=>{let b=node('button',undefined,'item');b.append(node('strong',x.name),node('span',money(x.price),'price'));b.onclick=()=>openCustom(x);area.append(b)});if(!area.children.length)area.append(node('p','這個分類尚無餐點','muted'))}
function unitPrice(line){const item=menu.find(x=>x.id===line.itemId);return (item?item.price:0)+line.addons.reduce((s,a)=>s+a.price,0)}
function sum(){return Object.values(cart).reduce((s,line)=>s+unitPrice(line)*line.qty,0)}
function variantKey(itemId,selected){return JSON.stringify([itemId,selected.map(a=>[a.id,a.name,a.price]).sort((a,b)=>a[0].localeCompare(b[0]))])}
function addVariant(itemId,selected,qty=1){let key=variantKey(itemId,selected);if(cart[key])cart[key].qty+=qty;else cart[key]={itemId,addons:structuredClone(selected),qty}}
function openCustom(item,key=null){let line=key?cart[key]:null;pending={itemId:item.id,key};$('customTitle').textContent=item.name+'・客製化';$('customHint').textContent=line?'修改本列 '+line.qty+' 份的加料；不同加料請另外點選餐點加入。':'可複選加料；不加料可直接按「加入訂單」。';$('customConfirm').textContent=line?'儲存變更':'加入訂單';let options=$('customOptions');options.replaceChildren();let available=structuredClone(addons);if(line)line.addons.forEach(a=>{if(!available.some(x=>x.id===a.id))available.push(a)});available.forEach(a=>{let label=node('label',undefined,'addon-choice'),input=node('input');input.type='checkbox';input.checked=!!line?.addons.some(x=>x.id===a.id);input.addon=a;input.onchange=customTotal;label.append(input,node('span',a.name),node('strong','+'+money(a.price)));options.append(label)});if(!available.length)options.append(node('p','尚無加料選項，可至菜單設定新增。','muted'));customTotal();$('customDialog').showModal()}
function selectedAddons(){return Array.from($('customOptions').querySelectorAll('input:checked')).map(x=>x.addon)}
function customTotal(){if(!pending)return;const item=menu.find(x=>x.id===pending.itemId);$('customTotal').textContent=money(item.price+selectedAddons().reduce((s,a)=>s+a.price,0))}
$('customCancel').onclick=()=>{$('customDialog').close();pending=null};
$('customDialog').addEventListener('cancel',()=>{pending=null});
$('customConfirm').onclick=()=>{if(!pending)return;let {itemId,key}=pending,selected=selectedAddons(),qty=key?cart[key].qty:1;if(key)delete cart[key];addVariant(itemId,selected,qty);$('customDialog').close();pending=null;renderCart()};
function renderCart(){let o=$('order');o.replaceChildren();let entries=Object.entries(cart);if(!entries.length)o.append(node('p','尚未選擇餐點','empty'));entries.forEach(([key,line])=>{let item=menu.find(x=>x.id===line.itemId);if(!item)return;let row=node('div',undefined,'orderline'),info=node('div'),qty=node('div',undefined,'qty'),custom=node('button','修改加料','customize');info.append(node('strong',item.name),node('div',line.addons.length?line.addons.map(a=>a.name+' +'+money(a.price)).join('、'):'不加料','muted'),node('div','每份 '+money(unitPrice(line))+' · 小計 '+money(unitPrice(line)*line.qty),'muted'));custom.setAttribute('aria-label','修改'+item.name+'加料');custom.onclick=()=>openCustom(item,key);info.append(custom);let minus=node('button','−'),plus=node('button','+');minus.setAttribute('aria-label','減少'+item.name);plus.setAttribute('aria-label','增加'+item.name);minus.onclick=()=>{if(--line.qty<=0)delete cart[key];renderCart()};plus.onclick=()=>{line.qty++;renderCart()};qty.append(minus,node('strong',String(line.qty)),plus);row.append(info,qty);o.append(row)});$('total').textContent=money(sum());calc()}
function calc(){let paid=$('paid').value,t=sum();if(paid===''){$('changeLabel').textContent='找零';$('change').textContent='$0';return}let p=Number(paid);if(!Number.isFinite(p)||p<0){$('change').textContent='請輸入有效金額';return}let d=Math.round(p)-t;$('changeLabel').textContent=d>=0?'找零':'尚差';$('change').textContent=money(Math.abs(d))}function clearOrder(){cart={};$('paid').value='';renderCart()}$('paid').addEventListener('input',calc);$('clear').onclick=()=>{if(Object.keys(cart).length&& !confirm('確定清空本筆訂單？'))return;clearOrder()};$('done').onclick=()=>{if(!Object.keys(cart).length)return alert('請先加入餐點');const p=$('paid').value;if(p===''||Number(p)<sum())return alert('實收金額不足或尚未輸入');if(confirm('確認完成結帳並清空本筆訂單？'))clearOrder()};[100,200,500,1000].forEach(v=>{let b=node('button',money(v));b.onclick=()=>{$('paid').value=v;calc()};$('quick').append(b)});let exact=node('button','剛好');exact.onclick=()=>{$('paid').value=sum();calc()};$('quick').prepend(exact);
$('settingToggle').onclick=()=>{$('settings').classList.toggle('show');if($('settings').classList.contains('show')){renderEditor();renderAddonEditor()}};function renderEditor(){const e=$('editor');e.replaceChildren();menu.forEach(x=>{let row=node('div',undefined,'editrow'),name=node('input'),price=node('input'),cat=node('select'),del=node('button','刪除','danger');name.value=x.name;name.maxLength=40;price.type='number';price.min=0;price.max=99999;price.step=1;price.value=x.price;categories.forEach(c=>{let op=node('option',c);op.value=c;cat.append(op)});cat.value=x.category;function update(){let n=name.value.trim(),p=Number(price.value);if(!n||price.value===''||!Number.isInteger(p)||p<0||p>99999)return;Object.assign(x,{name:n,price:p,category:cat.value});save();renderMenu();renderCart()}name.onchange=update;price.onchange=update;cat.onchange=update;del.onclick=()=>{if(!confirm('刪除 '+x.name+'？'))return;menu=menu.filter(y=>y.id!==x.id);Object.keys(cart).forEach(key=>{if(cart[key].itemId===x.id)delete cart[key]});save();renderEditor();renderMenu();renderCart()};row.append(name,cat,price,del);e.append(row)})}categories.forEach(c=>{let op=node('option',c);op.value=c;$('newCategory').append(op)});$('addForm').onsubmit=e=>{e.preventDefault();let name=$('newName').value.trim(),p=Number($('newPrice').value);if(!name||!Number.isInteger(p)||p<0||p>99999)return alert('請輸入正確名稱與整數價格');menu.push({id:'item-'+crypto.randomUUID(),name,price:p,category:$('newCategory').value});save();$('addForm').reset();renderEditor();renderMenu()};$('reset').onclick=()=>{if(!confirm('確定恢復示範菜單？目前修改會被覆蓋。'))return;menu=structuredClone(demo);cart={};save();renderEditor();renderMenu();clearOrder()};renderMenu();renderCart();
function renderAddonEditor(){let area=$('addonEditor');area.replaceChildren();addons.forEach(a=>{let row=node('div',undefined,'addon-editor'),name=node('input'),price=node('input'),del=node('button','刪除','danger');name.value=a.name;name.maxLength=40;name.setAttribute('aria-label',a.name+'名稱');price.type='number';price.min=0;price.max=99999;price.step=1;price.value=a.price;price.setAttribute('aria-label',a.name+'價格');function update(){const n=name.value.trim(),p=Number(price.value);if(!n||price.value===''||!Number.isInteger(p)||p<0||p>99999){alert('請輸入加料名稱與 0～99999 的整數價格');name.value=a.name;price.value=a.price;return}a.name=n;a.price=p;localStorage.setItem(ADDON_KEY,JSON.stringify(addons))}name.onchange=update;price.onchange=update;del.setAttribute('aria-label','刪除加料'+a.name);del.onclick=()=>{if(!confirm('刪除加料「'+a.name+'」？'))return;addons=addons.filter(x=>x.id!==a.id);localStorage.setItem(ADDON_KEY,JSON.stringify(addons));renderAddonEditor()};row.append(name,price,del);area.append(row)})}
$('addonForm').onsubmit=e=>{e.preventDefault();let name=$('addonName').value.trim(),p=Number($('addonPrice').value);if(!name||$('addonPrice').value===''||!Number.isInteger(p)||p<0||p>99999)return alert('請輸入加料名稱與 0～99999 的整數價格');addons.push({id:crypto.randomUUID(),name,price:p});localStorage.setItem(ADDON_KEY,JSON.stringify(addons));$('addonForm').reset();renderAddonEditor()};
</script></body></html>
